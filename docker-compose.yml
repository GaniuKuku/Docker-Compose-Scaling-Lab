services:

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - web

  web:
    build: ./app

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:

    image: postgres:17

    container_name: postgres-db

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:
